<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Leonas 18i Geburi ;) </title>
  <style>
    :root {
      --bg: #14100a;
      --bg-panel: #1d1710;
      --amber: #ffb000;
      --amber-dim: #a86e00;
      --cream: #f4ead9;
      --red: #ff5c5c;
      --pink: #ff6fae;
      --teal: #3ddad7;
      --purple: #b48cff;
      --yellow: #ffe066;
      --mono: ui-monospace, "SFMono-Regular", "Courier New", Consolas, monospace;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }

    body {
      background: var(--bg);
      color: var(--cream);
      font-family: var(--mono);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: repeating-linear-gradient(to bottom,
          rgba(255, 255, 255, 0.025) 0px,
          rgba(255, 255, 255, 0.025) 1px,
          transparent 1px,
          transparent 3px);
    }

    .screen { display: none; width: 100%; max-width: 560px; }
    .screen.active { display: block; animation: fadeIn .5s ease; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .terminal-wrap { position: relative; }

    .terminal {
      background: var(--bg-panel);
      border: 1px solid var(--amber-dim);
      border-radius: 6px;
      box-shadow: 0 0 40px rgba(255, 176, 0, 0.08);
      overflow: hidden;
    }

    .terminal-bar {
      background: #241b10;
      padding: 8px 14px;
      font-size: 12px;
      color: var(--amber-dim);
      border-bottom: 1px solid var(--amber-dim);
    }

    .terminal-body { padding: 28px 26px 32px; }

    .line { color: var(--amber-dim); font-size: 13px; margin: 0 0 6px; }

    h1 {
      font-size: clamp(22px, 5vw, 30px);
      line-height: 1.3;
      margin: 14px 0 6px;
      color: var(--amber);
      font-weight: 600;
    }

    .subline { color: var(--cream); opacity: .85; margin: 0 0 26px; font-size: 15px; }

    .button-row {
      position: relative;
      display: flex;
      gap: 16px;
      align-items: center;
      min-height: 90px;
      flex-wrap: wrap;
    }

    button {
      font-family: var(--mono);
      font-size: 16px;
      padding: 12px 20px;
      border-radius: 4px;
      border: 1px solid currentColor;
      background: transparent;
      cursor: pointer;
      transition: transform .18s ease, opacity .18s ease;
    }

    button:focus-visible { outline: 2px solid var(--cream); outline-offset: 3px; }

    #btn-yes { color: var(--amber); }
    #btn-yes:hover { background: rgba(255, 176, 0, 0.08); }
    #btn-no { color: var(--red); }
    #btn-no:hover { background: rgba(255, 92, 92, 0.08); }
    #btn-no.roaming { position: fixed; z-index: 5; }

    .reaction { min-height: 20px; margin-top: 18px; font-size: 13px; color: var(--amber-dim); }

    .sticker {
      position: absolute;
      font-size: 34px;
      pointer-events: none;
      filter: drop-shadow(0 3px 6px rgba(0, 0, 0, .4));
      z-index: 2;
    }
    .sticker.s1 { top: -18px; left: -14px; transform: rotate(-18deg); }
    .sticker.s2 { top: -20px; right: -10px; transform: rotate(14deg); }
    .sticker.s3 { bottom: -18px; left: -16px; transform: rotate(10deg); }
    .sticker.s4 { bottom: -16px; right: -14px; transform: rotate(-12deg); }

    .detail-row {
      margin: 0 0 16px;
      padding: 10px 14px;
      border-left: 3px solid var(--accent, var(--amber));
      background: rgba(255, 255, 255, 0.03);
      border-radius: 0 6px 6px 0;
    }
    .detail-row:nth-of-type(1) { --accent: var(--pink); }
    .detail-row:nth-of-type(2) { --accent: var(--teal); }

    .detail-label {
      color: var(--accent, var(--amber-dim));
      font-size: 12px;
      margin: 0 0 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .detail-value { color: var(--cream); font-size: 15px; margin: 0; line-height: 1.5; }
    .greeting { color: var(--amber); font-size: 17px; margin: 0 0 20px; }

    hr { border: none; border-top: 1px solid var(--amber-dim); opacity: .4; margin: 22px 0; }

    /* ---- Roboter-Szene ---- */
    .robot-scene {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 250px;
      justify-content: center;
      margin: 6px 0 28px;
      overflow: visible;
    }

    .dance-bot {
      position: absolute;
      font-size: 30px;
      z-index: 1;
      animation: dance 1.1s ease-in-out infinite;
      pointer-events: none;
    }
    .db1 { top: 6px;  left: 4%;  filter: hue-rotate(300deg) saturate(1.6); animation-delay: 0s; }
    .db2 { top: 18px; right: 4%; filter: hue-rotate(140deg) saturate(1.6); animation-delay: .2s; }
    .db3 { bottom: 34px; left: 0%;  filter: hue-rotate(50deg)  saturate(1.7); animation-delay: .4s; }
    .db4 { bottom: 26px; right: 0%; filter: hue-rotate(210deg) saturate(1.6); animation-delay: .6s; }

    @keyframes dance {
      0%, 100% { transform: rotate(-14deg) translateY(0); }
      50%      { transform: rotate(14deg) translateY(-7px); }
    }

    .confetti {
      position: absolute;
      width: 7px;
      height: 13px;
      top: -12px;
      z-index: 3;
      border-radius: 2px;
      animation: confettiFall 2.4s linear infinite;
      pointer-events: none;
    }
    .confetti.f1 { left: 6%;  background: var(--pink);   animation-delay: 0s;   }
    .confetti.f2 { left: 20%; background: var(--teal);   animation-delay: .4s;  }
    .confetti.f3 { left: 36%; background: var(--yellow); animation-delay: .9s;  }
    .confetti.f4 { left: 54%; background: var(--purple); animation-delay: .2s;  }
    .confetti.f5 { left: 70%; background: var(--amber);  animation-delay: 1.1s; }
    .confetti.f6 { left: 84%; background: var(--pink);   animation-delay: .7s;  }
    .confetti.f7 { left: 46%; background: var(--teal);   animation-delay: 1.4s; }

    @keyframes confettiFall {
      0%   { transform: translateY(0) rotate(0deg);   opacity: 1; }
      100% { transform: translateY(220px) rotate(340deg); opacity: 0; }
    }

    .robot-svg {
      position: relative;
      z-index: 2;
      animation: float 3.2s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-6px); }
    }

    .robot-eye { animation: blink 2.4s ease-in-out infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: .4; } }

    .robot-caption {
      position: relative;
      z-index: 2;
      color: var(--amber-dim);
      font-size: 12px;
      margin: 10px 0 0;
      text-align: center;
    }

    /* ---- Countdown ---- */
    .countdown { text-align: center; margin: 24px 0 4px; }
    .countdown-label { color: var(--amber-dim); font-size: 12px; margin: 0 0 10px; }
    .countdown-boxes { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

    .cd-box {
      border: 1px solid var(--amber-dim);
      border-radius: 6px;
      background: rgba(255, 176, 0, 0.05);
      padding: 8px 6px;
      min-width: 64px;
    }
    .cd-num { display: block; font-size: 26px; color: var(--amber); font-weight: 600; }
    .cd-unit { display: block; font-size: 11px; color: var(--cream); opacity: .7; }

    .countdown-done {
      display: none;
      font-size: clamp(24px, 6vw, 34px);
      color: var(--amber);
      font-weight: 700;
      margin: 6px 0;
    }
    .countdown.finished .countdown-boxes,
    .countdown.finished .countdown-label { display: none; }
    .countdown.finished .countdown-done { display: block; }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>

<body>

  <main>
    <section id="screen-rsvp" class="screen active">
      <div class="terminal">
        <div class="terminal-bar">geburtstag.exe</div>
        <div class="terminal-body">
          <p class="line">&gt; Iladig wird glade ...</p>
          <h1 id="rsvp-title"></h1>
          <p class="subline">Chunsch du a mini Geburifier?</p>
          <div class="button-row">
            <button id="btn-yes">Jupp, sowas vo! 🎉</button>
            <button id="btn-no">Nope 😢</button>
          </div>
          <p class="reaction" id="reaction-text"></p>
        </div>
      </div>
    </section>

    <section id="screen-details" class="screen">
      <div class="terminal-wrap">
        <span class="sticker s1">🎉</span>
        <span class="sticker s2">🎈</span>
        <span class="sticker s3">✨</span>
        <span class="sticker s4">🎂</span>
        <div class="terminal">
          <div class="terminal-bar">details.exe</div>
          <div class="terminal-body">
            <p class="line">&gt; Zugriff gewährt. Lade Details ...</p>
            <p class="greeting" id="greeting"></p>

            <p class="detail-value" id="detail-intro"></p>
            <hr>

            <div class="detail-row">
              <p class="detail-label"> Wann</p>
              <p class="detail-value" id="detail-when"></p>
            </div>
            <div class="detail-row">
              <p class="detail-label"> Wo</p>
              <p class="detail-value" id="detail-where"></p>
            </div>

            <div class="robot-scene">
              <span class="confetti f1"></span>
              <span class="confetti f2"></span>
              <span class="confetti f3"></span>
              <span class="confetti f4"></span>
              <span class="confetti f5"></span>
              <span class="confetti f6"></span>
              <span class="confetti f7"></span>

              <span class="dance-bot db1">🤖</span>
              <span class="dance-bot db2">🤖</span>
              <span class="dance-bot db3">🤖</span>
              <span class="dance-bot db4">🤖</span>

              <svg class="robot-svg" viewBox="0 0 220 240" width="170" height="186"
                   xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Roboter tanzt unter einer Discokugel mit der Zahl 18">
                <defs>
                  <pattern id="discoPattern" patternUnits="userSpaceOnUse" width="8" height="8">
                    <rect width="8" height="8" fill="#4a3a1c"/>
                    <rect width="4" height="4" fill="#6b5426"/>
                    <rect x="4" y="4" width="4" height="4" fill="#6b5426"/>
                  </pattern>
                </defs>

                <g id="discoball">
                  <circle cx="110" cy="26" r="22" fill="url(#discoPattern)" stroke="var(--amber)" stroke-width="2"/>
                  <line x1="94" y1="10" x2="126" y2="42" stroke="#fff" stroke-width="2" opacity=".35"/>
                  <line x1="90" y1="26" x2="130" y2="26" stroke="#fff" stroke-width="1.5" opacity=".25"/>
                  <animateTransform attributeName="transform" type="rotate" from="0 110 26" to="360 110 26" dur="6s" repeatCount="indefinite"/>
                </g>
                <text x="110" y="63" text-anchor="middle" font-family="ui-monospace, monospace" font-size="24" font-weight="700" fill="var(--amber)">18</text>

                <line x1="70" y1="130" x2="80" y2="70" stroke="var(--amber-dim)" stroke-width="10" stroke-linecap="round"/>
                <line x1="150" y1="130" x2="140" y2="70" stroke="var(--amber-dim)" stroke-width="10" stroke-linecap="round"/>

                <rect x="80" y="76" width="60" height="46" rx="10" fill="var(--bg-panel)" stroke="var(--amber-dim)" stroke-width="3"/>
                <rect class="robot-eye" x="92" y="94" width="14" height="9" rx="2" fill="var(--amber)"/>
                <rect class="robot-eye" x="114" y="94" width="14" height="9" rx="2" fill="var(--amber)"/>

                <rect x="102" y="122" width="16" height="8" fill="var(--amber-dim)"/>

                <path d="M58 130 L162 130 L150 200 L70 200 Z" fill="var(--bg-panel)" stroke="var(--amber-dim)" stroke-width="3"/>
                <line x1="80" y1="146" x2="140" y2="146" stroke="var(--amber-dim)" stroke-width="2" opacity=".6"/>
                <line x1="85" y1="164" x2="135" y2="164" stroke="var(--amber-dim)" stroke-width="2" opacity=".6"/>

                <rect x="46" y="128" width="24" height="18" rx="5" fill="var(--amber-dim)"/>
                <rect x="150" y="128" width="24" height="18" rx="5" fill="var(--amber-dim)"/>

                <rect x="80" y="200" width="20" height="34" rx="4" fill="var(--bg-panel)" stroke="var(--amber-dim)" stroke-width="3"/>
                <rect x="120" y="200" width="20" height="34" rx="4" fill="var(--bg-panel)" stroke="var(--amber-dim)" stroke-width="3"/>
              </svg>
              <p class="robot-caption">🤖✨ 18 Jahr sind scho vergange ✨🤖</p>
            </div>

            <div class="countdown" id="countdown">
              <p class="countdown-label"> No bis zur Fier</p>
              <div class="countdown-boxes">
                <div class="cd-box"><span class="cd-num" id="cd-days">00</span><span class="cd-unit">Tage</span></div>
                <div class="cd-box"><span class="cd-num" id="cd-hours">00</span><span class="cd-unit">Std</span></div>
                <div class="cd-box"><span class="cd-num" id="cd-mins">00</span><span class="cd-unit">Min</span></div>
                <div class="cd-box"><span class="cd-num" id="cd-secs">00</span><span class="cd-unit">Sek</span></div>
              </div>
              <p class="countdown-done">🎉 LET'S GOOO! 🎉</p>
            </div>

            <hr>
            <p class="detail-value" id="detail-contact"></p>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script>
    const CONFIG = {
      name: "Leonaa",
      personalGreeting: "",
      intro: "Heyoo, I wör di gern zu mim 18 Geburi ilade, wersch debi? ",
      when: "Sunntig, 25. Oktober 2026 ab 14:00 Uhr",
      where: "Be mer dihei",
      contact: "Freu mi uf di 🎉",
      partyDate: new Date(2026, 9, 25, 14, 0, 0),
    };

    document.getElementById("rsvp-title").textContent = CONFIG.name + " wird 18i! 🎂";

    document.getElementById("greeting").textContent =
      CONFIG.personalGreeting || ("Schö dass du chunsch, " + "!");
    if (!CONFIG.personalGreeting) {
      document.getElementById("greeting").style.display = "none";
    }
    document.getElementById("detail-intro").textContent = CONFIG.intro;
    document.getElementById("detail-when").textContent = CONFIG.when;
    document.getElementById("detail-where").textContent = CONFIG.where;
    document.getElementById("detail-contact").textContent = CONFIG.contact;

    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      document.querySelectorAll('animateTransform').forEach(a => a.setAttribute('repeatCount', '0'));
    }

    // --- Countdown ---
    const countdownEl = document.getElementById("countdown");
    const pad = (n) => String(n).padStart(2, "0");

    function updateCountdown() {
      const diff = CONFIG.partyDate - new Date();
      if (diff <= 0) {
        countdownEl.classList.add("finished");
        clearInterval(countdownTimer);
        return;
      }
      document.getElementById("cd-days").textContent = pad(Math.floor(diff / 86400000));
      document.getElementById("cd-hours").textContent = pad(Math.floor(diff / 3600000) % 24);
      document.getElementById("cd-mins").textContent = pad(Math.floor(diff / 60000) % 60);
      document.getElementById("cd-secs").textContent = pad(Math.floor(diff / 1000) % 60);
    }
    const countdownTimer = setInterval(updateCountdown, 1000);
    updateCountdown();

    // --- Ja/Nein Logik ---
    const btnYes = document.getElementById("btn-yes");
    const btnNo = document.getElementById("btn-no");
    const reaction = document.getElementById("reaction-text");
    const screenRsvp = document.getElementById("screen-rsvp");
    const screenDetails = document.getElementById("screen-details");

    const yesTexts = ["Jeyy! 🎉", "Jupppiii 😄", "Freu mii...", "Fast am Ziel!", "Los goht's! 🚀"];
    const noTexts = ["Bisch der sicher?", "Wirklich wirklich sicher?", "Schaddd... 🥺", "Okii i verstohh...", "okidoki .... 🙈"];

    let yesClicks = 0;
    let noClicks = 0;

    btnYes.addEventListener("click", () => {
      yesClicks++;
      const scale = 1 + yesClicks * 0.35;
      btnYes.style.transform = `scale(${scale})`;
      reaction.textContent = yesTexts[Math.min(yesClicks - 1, yesTexts.length - 1)];
      if (yesClicks >= 5) {
        setTimeout(goToDetails, 400);
      }
    });

    btnNo.addEventListener("click", () => {
      noClicks++;
      const scale = Math.max(0.15, 1 - noClicks * 0.15);
      btnNo.classList.add("roaming");
      btnNo.style.transform = `scale(${scale})`;

      const maxX = window.innerWidth - 120;
      const maxY = window.innerHeight - 60;
      btnNo.style.left = Math.max(10, Math.random() * maxX) + "px";
      btnNo.style.top = Math.max(10, Math.random() * maxY) + "px";

      reaction.textContent = noTexts[Math.min(noClicks - 1, noTexts.length - 1)];
    });

    function goToDetails() {
      screenRsvp.classList.remove("active");
      screenDetails.classList.add("active");
    }
  </script>

</body>

</html>
